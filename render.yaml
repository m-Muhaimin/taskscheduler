# ------------------------------------------------------------------
# Render Blueprint — tradescheduler (RidgeLine)
#
# Services:
#   ridgeline-api    — Express API
#   ridgeline-worker — SMS processing background worker
#   ridgeline        — Next.js web app
#
# Secrets are intentionally NOT stored in this file.
# Configure them in Render Dashboard during the first Blueprint sync.
# ------------------------------------------------------------------

services:

  # ----------------------------------------------------------------
  # Express API
  # ----------------------------------------------------------------
  - type: web
    name: ridgeline-api
    runtime: node
    region: oregon

    buildCommand: npm ci && npm run build --workspace=apps/api
    startCommand: npm run db:migrate --workspace=apps/api && npm start --workspace=apps/api
    healthCheckPath: /api/health

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: TWILIO_ACCOUNT_SID
        sync: false

      - key: TWILIO_AUTH_TOKEN
        sync: false

      - key: TWILIO_PHONE_NUMBER
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_REDIRECT_URI
        sync: false

      - key: AI_PROVIDER
        value: ollama

      - key: OLLAMA_MODEL
        value: gemma4:cloud

      - key: OLLAMA_BASE_URL
        value: https://api.ollama.com

      - key: OLLAMA_API_KEY
        sync: false

      - key: WEB_BASE_URL
        value: https://ridgelineai.onrender.com


  # ----------------------------------------------------------------
  # SMS processing worker
  # ----------------------------------------------------------------
  - type: worker
    name: ridgeline-worker
    runtime: node
    region: oregon

    buildCommand: npm ci && npm run build --workspace=apps/api
    startCommand: npm run db:migrate --workspace=apps/api && npm run worker:start --workspace=apps/api

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: TWILIO_ACCOUNT_SID
        sync: false

      - key: TWILIO_AUTH_TOKEN
        sync: false

      - key: TWILIO_PHONE_NUMBER
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_REDIRECT_URI
        sync: false


  # ----------------------------------------------------------------
  # Next.js web application
  # ----------------------------------------------------------------
  - type: web
    name: ridgeline
    runtime: node
    region: oregon

    buildCommand: npm ci && npm run build --workspace=apps/web
    startCommand: npm start --workspace=apps/web -- -p $PORT

    envVars:
      - key: API_BASE_URL
        fromService:
          name: ridgeline-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL